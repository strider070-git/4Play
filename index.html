var NO_CLOCK = { s6q:1, s7a:1 };

function plugins(){ return (window.Capacitor && window.Capacitor.Plugins) || {}; }
function hz(style){

function fresh(){
  var names = ["Russell","Michelle","Male 1","Female 1"];
  var sexes = ["M","F","M","F"];
  return {
    v:BV, setup:true, done:false,
    players:names.map(function(n,i){
      return { name:n, sex:sexes[i], traits:[], gear:Object.assign({},DEFAULTS[sexes[i]]), wear:[] };
    }),
    removed:[0,0,0,0],
    length:"normal",
    stage:1, plan:[], planPos:0, bag:[], setups:[], used:{},
    queue:[], outs:[0,0,0,0],
    cur:null, revealed:false, coach:"", timeLeft:0, running:false,
    confirm:false, tox:false
  };
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || s.v !== BV) return null;
    s.running = false;
    s.confirm = false;
    if(!s.removed) s.removed = [0,0,0,0];
    return s;
  }catch(e){ return null; }
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function P(i){ return state.players[i]; }
function partnerOf(i){ return i===0?1:(i===1?0:(i===2?3:2)); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function buildWear(gear){
  var out=[];
  ["outer","feet","top","bottom","under"].forEach(function(slot){
    var g = gear[slot];
    if(!g || g==="None" || g==="Bare feet") return;
    out.push({slot:slot, name:g});
  });
  return out;
}

function syncWear(i){ P(i).wear = buildWear(P(i).gear).slice(state.removed[i] || 0); }
function syncAll(){ for(var i=0;i<4;i++) syncWear(i); }

function slotName(i,slot){
  var w=P(i).wear;
  for(var k=0;k<w.length;k++) if(w[k].slot===slot) return w[k].name;
  return null;
}
function topTok(i){ return slotName(i,"top") || slotName(i,"outer") || "bare skin"; }
function bottomTok(i){ return slotName(i,"bottom") || "bare legs"; }
function underTok(i){ return slotName(i,"under") || "nothing underneath"; }
function anyTok(i){ var w=P(i).wear; return w.length ? w[0].name : "bare skin"; }
function removePhrase(i){ var w=P(i).wear; return w.length ? w[0].name : "the nearest thing to hand"; }
function blindTok(i){ return "a tie or a scarf, or " + (P(i).sex==="M"?"his":"her") + " own hand"; }

function stripFor(i,beat){
  var w = P(i).wear;
  if(!w.length || state.stage <= 1) return 0;
  var n = 0, s = state.stage;
  if(s === 2){ n = beat.pick === "all" ? 1 : 0; }
  else if(s === 3){
    if(beat.pick === "all"){
      if(beat.depth === "all") n = w.length;
      else if(beat.depth === "under"){
        var k = 0;
        while(k < w.length && w[k].slot !== "under") k++;
        n = k;
      } else n = 1;
    } else n = 1;
  } else {
    n = beat.pick === "all" ? w.length : 1;
  }
  n = Math.min(n, w.length);
  if(n){ state.removed[i] = (state.removed[i]||0) + n; syncWear(i); }
  return n;
}

function posLine(A,B,which){
  var a=P(A).sex;

  if(which===1){
    if(a==="F" && P(B).sex==="M") return an+" on her back, "+bn+" between her legs";
    if(a==="F") return an+" on her back, "+bn+" above her";
    return an+" on his back, "+bn+" above him";
  }
  if(a==="F") return bn+" behind "+an+", "+an+" on her front";
  return bn+" behind "+an+", "+an+" on his front";
}

function fill(text,A,Bc){

  if(A != null){
    var a = P(A), ap = a.sex==="M"?"his":"her", ao = a.sex==="M"?"him":"her";
    sub("{A.poss}", ap);
    sub("{A.obj}", ao);
    sub("{A.pron}", a.sex==="M"?"he":"she");
    sub("{A.self}", a.sex==="M"?"himself":"herself");
    sub("{A.chest}", a.sex==="M"?"chest":"breasts");
    sub("{A.crotch}", a.sex==="M"?"cock":"pussy");
    sub("{A.ass}", "ass");
    sub("{A.nips}", "nipples");
    sub("{A.top}", topTok(A));
    sub("{A.bottom}", bottomTok(A));
    sub("{A.under}", underTok(A));
    sub("{A.any}", anyTok(A));
    sub("{A.remove1}", removePhrase(A));
    sub("{A.blind}", blindTok(A));
    sub("{A}", "<b>"+esc(a.name)+"</b>");
  }
  if(Bc != null){
    var b = P(Bc), bp = b.sex==="M"?"his":"her";
    sub("{B.poss}", bp);
    sub("{B.chest}", b.sex==="M"?"chest":"breasts");
    sub("{B}", "<b>"+esc(b.name)+"</b>");
  }
  if(A != null && Bc != null){
    sub("{POS1}", posLine(A,Bc,1));
    sub("{POS2}", posLine(A,Bc,2));
    sub("{POS3}", posLine(A,Bc,3));
  }
  return out;
}

function activePlan(){
  var base = PLANS[state.stage] || [];
  if(!base.length) return [];
  if(state.length === "short"){
    if(state.stage === 3) return SHORT3.slice();
    if(state.stage === 7) return base.slice(0,4);
    return base.slice(0,6);
  }
  if(state.length === "long"){
    if(state.stage === 3) return base.concat(LONG3TAIL);
    if(state.stage === 6) return base.concat(LONG6TAIL);
    return base.concat(base.slice(0,4));
  }
  return base.slice();
}

function avail(){
  var a = [0,1,2,3].filter(function(i){ return (state.outs[i]||0) < 2; });
  return a.length ? a : [0,1,2,3];
}
function queueTake(avoid){
  function blocked(i){ return (state.outs[i]||0) >= 2 || i === avoid; }
  while(state.queue.length && blocked(state.queue[0])) state.queue.shift();
  if(!state.queue.length){
    var pool = avail().filter(function(i){ return i !== avoid; });
    if(!pool.length) pool = [0,1,2,3].filter(function(i){ return i !== avoid; });
    state.queue = shuffle(pool);
  }
  return state.queue.shift();
}
function chooseB(A,avoid){
  var pool = avail().filter(function(i){ return i !== A && i !== avoid; });
  if(!pool.length) pool = [0,1,2,3].filter(function(i){ return i !== A && i !== avoid; });
  if(!pool.length) pool = [0,1,2,3].filter(function(i){ return i !== A; });
  var partner = partnerOf(A);
  var cross = pool.filter(function(i){ return i !== partner; });
  if(cross.length) pool = cross;
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickCoach(A){
  var pool = avail().filter(function(i){ return i !== A; });
  if(!pool.length) pool = [0,1,2,3].filter(function(i){ return i !== A; });
  return pool[Math.floor(Math.random()*pool.length)];
}

function slotTarget(){
  var pick = state.plan[state.planPos];
  var n = state.plan.length;
  if(pick === "all"){
    var idx = 0, cnt = 0;
    for(var k=0;k<n;k++){
      if(state.plan[k] === "all"){ if(k < state.planPos) idx++; cnt++; }
    }
    if(cnt > 1) return 1 + (idx/(cnt-1))*5;
  }
  return n > 1 ? 1 + (state.planPos/(n-1))*5 : 3;
}

function drawBeat(){
  if(state.planPos >= state.plan.length) return null;
  var pick = state.plan[state.planPos];
  var target = slotTarget();
  var pool = state.bag.filter(function(b){ return b.pick===pick && !state.used[b.id]; });
  if(!pool.length) pool = state.bag.filter(function(b){ return !state.used[b.id]; });
  if(!pool.length){ state.used = {}; pool = state.bag.filter(function(b){ return b.pick===pick; }); }
  if(!pool.length) pool = state.bag.slice();
  if(!pool.length) return null;
  var best = Math.min.apply(null, pool.map(function(b){ return Math.abs(b.tier-target); }));
  var near = pool.filter(function(b){ return Math.abs(b.tier-target) === best; });
  return near[Math.floor(Math.random()*near.length)];
}

function drawNext(){
  state.revealed = false;
  state.running = false;
  var beat = null;
  if(state.setups.length){
    var id = state.setups.shift();
    beat = BEATS.filter(function(b){ return b.id===id; })[0] || null;
  } else {
    beat = drawBeat();
  }
  if(!beat){
    state.cur = null;
    if(state.stage >= 7){ state.done = true; stopTimer(); return; }
    startStage(state.stage + 1);
    return;
  }
  state.used[beat.id] = true;
  var A = queueTake(null);
  var Bc = (beat.pick === "two") ? chooseB(A,null) : null;
  state.cur = { beat:beat, A:A, B:Bc, deltas:[] };
  state.coach = (beat.pick === "solo" && state.stage < 6) ? pickCoach(A) : "";
  state.timeLeft = beat.dur;
}

function startStage(n){
  state.stage = n;
  state.plan = activePlan();
  state.planPos = 0;
  state.used = {};
  state.outs = [0,0,0,0];
  state.setups = (SETUPS[n] || []).slice();
  state.bag = shuffle(BEATS.filter(function(b){ return b.stage===n && b.pick!=="setup"; }));
  state.queue = [];
  state.coach = "";
  drawNext();
  save();
}

function reveal(){
  if(!state.cur || state.revealed) return;
  state.revealed = true;
  hz("medium");
  var beat = state.cur.beat;
  var deltas = [];
  function take(i){
    var n = stripFor(i,beat);
    if(n) deltas.push([i,n]);
  }
  if(beat.pick === "all"){ for(var i=0;i<4;i++) take(i); }
  else { take(state.cur.A); if(state.cur.B != null) take(state.cur.B); }
  state.cur.deltas = deltas;
  if(!NO_CLOCK[beat.id]) startTimer();
  save();
}

function advance(){
  if(state.cur && state.cur.beat.pick !== "setup") state.planPos++;
  if(state.planPos >= state.plan.length){
    if(state.stage >= 7){ state.done = true; state.cur = null; stopTimer(); save(); render(); return; }
    startStage(state.stage + 1);
  } else {
    drawNext();
  }
  save(); render();
}

function next(){ if(state.cur && state.revealed){ hz("light"); advance(); } }

function undoDeltas(){
  if(!state.cur || !state.cur.deltas) return;
  state.cur.deltas.forEach(function(d){
    state.removed[d[0]] = Math.max(0, (state.removed[d[0]]||0) - d[1]);
    syncWear(d[0]);
  });
  state.cur.deltas = [];
}

function redraw(avoid){
  if(!state.cur) return;
  stopTimer();
  undoDeltas();
  state.revealed = false;
  var av = (avoid == null) ? null : avoid;
  if(av != null) state.queue = state.queue.filter(function(x){ return x !== av; });
  state.cur.A = queueTake(av);
  state.cur.B = (state.cur.beat.pick === "two") ? chooseB(state.cur.A, av) : null;
  state.coach = (state.cur.beat.pick === "solo" && state.stage < 6) ? pickCoach(state.cur.A) : "";
  state.timeLeft = state.cur.beat.dur;
  save(); render();
}

function skipBeat(){ if(state.cur){ stopTimer(); undoDeltas(); advance(); } }

function outPlayer(i){

function restartGame(){

  if(!state.running) return;

    (state.tox ? '<div class="tox">' + ["{A.top}","{A.bottom}","{A.under}","{A.any}","{A.remove1}","{A.blind}"].map(function(x){ return '<span>'+x+'</span>'; }).join("") + '</div>' : "") +
    '<div class="outhint">'+((beat && (beat.pick==="all" || beat.pick==="setup")) ? "No outs on this beat." : "Out sends the beat to someone else. Two outs and that player sits out the stage.")+'</div>' +
    '<div class="outs">'+outs+'</div>';
}

function endHTML(){
  return (state.confirm ? overlayHTML() : "") +
    '<div class="end"><h2>The night is done</h2>' +
    '<p class="lede">Seven stages. Everyone bare, everyone spent.</p>' +
    '<button class="primary" id="again">Start again</button></div>';
}

function cancelConfirm(){ state.confirm = false; render(); }

function bindGame(){
  document.onkeydown = function(e){
    if(state.confirm && (e.key === "Escape" || e.keyCode === 27)) cancelConfirm();
  };
  var ovl = document.getElementById("ovl");
  if(ovl) ovl.onclick = function(e){ if(e.target === ovl) cancelConfirm(); };

  var again = document.getElementById("again");
  if(again) again.onclick = function(){ openConfirm(); };
  var r = document.getElementById("restart");
  if(r) r.onclick = function(){ openConfirm(); };
  var pl = document.getElementById("players");
  if(pl) pl.onclick = openSetup;
  var y = document.getElementById("yes");
  if(y) y.onclick = function(){ state.confirm = false; restartGame(); };
  var n = document.getElementById("no");
  if(n) n.onclick = cancelConfirm;

  var rev = document.getElementById("rev");
  if(rev) rev.onclick = function(){ reveal(); render(); };
  var nx = document.getElementById("next");
  if(nx) nx.onclick = next;
  var rd = document.getElementById("redraw");
  if(rd) rd.onclick = function(){ redraw(null); };
  var sk = document.getElementById("skip");
  if(sk) sk.onclick = skipBeat;

  var ts = document.getElementById("tstart");
  if(ts) ts.onclick = function(){ if(state.running) stopTimer(); else startTimer(); render(); };
  var tr = document.getElementById("treset");
  if(tr) tr.onclick = function(){ stopTimer(); state.timeLeft = state.cur ? state.cur.beat.dur : 0; render(); };
  var tx = document.getElementById("tox");
  if(tx) tx.onclick = function(){ state.tox = !state.tox; render(); };

  document.querySelectorAll("[data-out]").forEach(function(el){
    el.onclick = function(){ outPlayer(+el.dataset.out); };
  });
}

function openConfirm(){
  stopTimer();
  state.confirm = true;
  render();
  window.scrollTo(0,0);
}

(function boot(){
  var loaded = load();
  state = loaded || fresh();
  if(!state.players) state = fresh();
  state.running = false;
  if(!state.removed) state.removed = [0,0,0,0];
  syncAll();
  render();
  if("serviceWorker" in navigator && location.protocol === "https:"){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
